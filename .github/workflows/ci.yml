# Runs on GitHub-hosted runners for every push and pull request. Nothing here deploys.
name: CI
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact checked-out base commit for an uncommitted preview
        type: string
        required: false
      patch_base64:
        description: Canonical base64 text patch, at most 48000 decoded bytes
        type: string
        required: false
      patch_sha256:
        description: SHA256 of the decoded text patch
        type: string
        required: false
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Apply exact uncommitted preview (no commit)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.patch_base64 != '' }}
        env:
          JOBCHIT_PREVIEW_EVIDENCE: ${{ runner.temp }}/jobchit-ci-preview.json
        run: node scripts/apply-ci-preview.mjs
      - name: gitleaks (uncommitted preview)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.patch_base64 != '' }}
        run: git diff --cached --binary | docker run --rm -i -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f stdin --config /repo/.gitleaks.toml --redact --no-banner
      - run: npm ci
      # The runner fetches Chromium's system packages from the Ubuntu mirrors, which sometimes
      # reset connections (2026-11-19 runs failed this way). Try up to three times before failing.
      - name: Install Chromium and its system packages
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed; retrying in 30 seconds."
            sleep 30
          done
          exit 1
      - name: Build (root and /jobchit-site/)
        run: |
          npm run build:site
          PATH_PREFIX=/jobchit-site/ OUT_DIR=_site-sub npm run build:site
      - name: Template PDFs
        run: |
          npm run pdf
          PATH_PREFIX=/jobchit-site/ node scripts/pdf.mjs _site-sub
      - name: Unit tests
        run: npm run test:unit
      - name: BDD and axe
        run: npm run test:e2e
      - name: Lighthouse CI
        run: npm run lhci
      - name: Retain uncommitted preview identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.patch_base64 != '' }}
        env:
          JOBCHIT_PREVIEW_EVIDENCE: ${{ runner.temp }}/jobchit-ci-preview.json
        run: |
          node scripts/apply-ci-preview.mjs --verify
          cp "$JOBCHIT_PREVIEW_EVIDENCE" _site/jobchit-ci-preview.json
      - name: Retain built PDFs and site (no deployment)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: jobchit-ci-output
          path: _site
